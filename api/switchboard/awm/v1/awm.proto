syntax = "proto3";

package switchboard.awm.v1;

option go_package = "github.com/daltoniam/switchboard/gen/awm/v1;awmv1";

import "google/protobuf/timestamp.proto";

// ProjectCatalogService is the strongly typed counterpart of the project_*
// MCP tools and project:// catalog resources.
service ProjectCatalogService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc SearchProjects(SearchProjectsRequest) returns (SearchProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ResolveProject(ResolveProjectRequest) returns (ResolveProjectResponse);
  rpc ValidateProject(ValidateProjectRequest) returns (ValidateProjectResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc PatchProject(PatchProjectRequest) returns (PatchProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  rpc GetProjectRevision(GetProjectRevisionRequest) returns (GetProjectRevisionResponse);
  rpc GetProjectDiagnostics(GetProjectDiagnosticsRequest) returns (GetProjectDiagnosticsResponse);
}

// WorkProfileService is the strongly typed counterpart of the
// project_work_profile_* MCP tools.
service WorkProfileService {
  rpc ListWorkProfiles(ListWorkProfilesRequest) returns (ListWorkProfilesResponse);
  rpc GetWorkProfile(GetWorkProfileRequest) returns (GetWorkProfileResponse);
  rpc PutWorkProfile(PutWorkProfileRequest) returns (PutWorkProfileResponse);
  rpc DeleteWorkProfile(DeleteWorkProfileRequest) returns (DeleteWorkProfileResponse);
}

// AgentProfileService is the strongly typed counterpart of the
// project_agent_profile_* MCP tools.
service AgentProfileService {
  rpc ListAgentProfiles(ListAgentProfilesRequest) returns (ListAgentProfilesResponse);
  rpc GetAgentProfile(GetAgentProfileRequest) returns (GetAgentProfileResponse);
  rpc PutAgentProfile(PutAgentProfileRequest) returns (PutAgentProfileResponse);
  rpc DeleteAgentProfile(DeleteAgentProfileRequest) returns (DeleteAgentProfileResponse);
}

// WorkSessionService is the strongly typed counterpart of the
// project_work_session_* MCP tools.
service WorkSessionService {
  rpc ListWorkSessions(ListWorkSessionsRequest) returns (ListWorkSessionsResponse);
  rpc GetWorkSession(GetWorkSessionRequest) returns (GetWorkSessionResponse);
  rpc CreateWorkSession(CreateWorkSessionRequest) returns (CreateWorkSessionResponse);
  rpc TransitionWorkSession(TransitionWorkSessionRequest) returns (TransitionWorkSessionResponse);
  rpc PatchWorkSession(PatchWorkSessionRequest) returns (PatchWorkSessionResponse);
  rpc DeleteWorkSession(DeleteWorkSessionRequest) returns (DeleteWorkSessionResponse);
}

// ResourceService manages independently addressable resources known to AWM.
// Resource identity is descriptive and does not grant access.
service ResourceService {
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse);
  rpc PutResource(PutResourceRequest) returns (PutResourceResponse);
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse);
}

// ResourceBindingService attaches a Resource to exactly one WorkSession with
// a session-specific locator and narrowed capability grant.
service ResourceBindingService {
  rpc ListResourceBindings(ListResourceBindingsRequest) returns (ListResourceBindingsResponse);
  rpc GetResourceBinding(GetResourceBindingRequest) returns (GetResourceBindingResponse);
  rpc CreateResourceBinding(CreateResourceBindingRequest) returns (CreateResourceBindingResponse);
  rpc TransitionResourceBinding(TransitionResourceBindingRequest) returns (TransitionResourceBindingResponse);
  rpc PatchResourceBinding(PatchResourceBindingRequest) returns (PatchResourceBindingResponse);
  rpc DeleteResourceBinding(DeleteResourceBindingRequest) returns (DeleteResourceBindingResponse);
}

// ErrorCode is stable across transports. gRPC status codes communicate the
// broad failure class; ErrorDetail carries the AWM/catalog-specific reason.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NOT_FOUND = 1;
  ERROR_CODE_ALREADY_EXISTS = 2;
  ERROR_CODE_INVALID_INPUT = 3;
  ERROR_CODE_INVALID_REFERENCE = 4;
  ERROR_CODE_INVALID_TRANSITION = 5;
  ERROR_CODE_REFERENCED = 6;
  ERROR_CODE_POLICY_BROADENING = 7;
  ERROR_CODE_CONFLICT = 8;
  ERROR_CODE_MISSING_DEFAULT_PROFILE = 9;
  ERROR_CODE_WRITE_DISABLED = 10;
  ERROR_CODE_LOCK_TIMEOUT = 11;
  ERROR_CODE_UNAVAILABLE = 12;
  ERROR_CODE_INTERNAL = 13;
  ERROR_CODE_REVISION_CONFLICT = 14;
  ERROR_CODE_AMBIGUOUS_PROJECT = 15;
  ERROR_CODE_INVALID_ROOT = 16;
  ERROR_CODE_ROOT_PROJECT_MISMATCH = 17;
  ERROR_CODE_PERMISSION_DENIED = 18;
  ERROR_CODE_INVALID_DEFINITION = 19;
}

message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  string entity_kind = 3;
  string entity_id = 4;
  string project_id = 5;
  string work_profile_id = 6;
  string work_session_id = 7;
  string expected = 8;
  string current = 9;
  string root_uri = 10;
  repeated Diagnostic diagnostics = 11;
  string resource_id = 12;
  string resource_binding_id = 13;
}

// PolicyDocument deliberately permits only boolean capability decisions.
// This replaces the MCP implementation's arbitrary JSON policy objects with a
// generated, closed value type. Capability names are application-defined;
// duplicate names are invalid.
message PolicyDocument {
  repeated CapabilityPolicy capabilities = 1;
}

message CapabilityPolicy {
  string capability = 1;
  bool allowed = 2;
}

// AgentConstraints is the implemented AWM subset. It replaces arbitrary JSON
// constraints with the only constraint Switchboard currently interprets.
message AgentConstraints {
  repeated string project_ids = 1;
}

enum WorkSessionState {
  WORK_SESSION_STATE_UNSPECIFIED = 0;
  WORK_SESSION_STATE_PROPOSED = 1;
  WORK_SESSION_STATE_OPEN = 2;
  WORK_SESSION_STATE_PAUSED = 3;
  WORK_SESSION_STATE_CLOSED = 4;
  WORK_SESSION_STATE_ABORTED = 5;
}

enum ResourceBindingState {
  RESOURCE_BINDING_STATE_UNSPECIFIED = 0;
  RESOURCE_BINDING_STATE_PROPOSED = 1;
  RESOURCE_BINDING_STATE_BOUND = 2;
  RESOURCE_BINDING_STATE_REVOKED = 3;
}

message Resource {
  string version = 1;
  string resource_id = 2;
  string uri = 3;
  string kind = 4;
  string display_name = 5;
}

message ResourceBinding {
  string version = 1;
  string resource_binding_id = 2;
  string work_session_id = 3;
  string resource_id = 4;
  PolicyDocument grant = 5;
  string resolved_locator = 6;
  ResourceBindingState state = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListResourcesRequest {}

message ListResourcesResponse {
  repeated Resource resources = 1;
}

message GetResourceRequest {
  string resource_id = 1;
}

message GetResourceResponse {
  Resource resource = 1;
}

message PutResourceRequest {
  Resource resource = 1;
}

message PutResourceResponse {
  Resource resource = 1;
}

message DeleteResourceRequest {
  string resource_id = 1;
}

message DeleteResourceResponse {
  string resource_id = 1;
  bool deleted = 2;
}

message ListResourceBindingsRequest {
  ResourceBindingState state = 1;
  string work_session_id = 2;
  string resource_id = 3;
}

message ListResourceBindingsResponse {
  repeated ResourceBinding resource_bindings = 1;
}

message GetResourceBindingRequest {
  string resource_binding_id = 1;
}

message GetResourceBindingResponse {
  ResourceBinding resource_binding = 1;
}

message CreateResourceBindingRequest {
  ResourceBinding resource_binding = 1;
}

message CreateResourceBindingResponse {
  ResourceBinding resource_binding = 1;
}

message TransitionResourceBindingRequest {
  string resource_binding_id = 1;
  ResourceBindingState state = 2;
}

message TransitionResourceBindingResponse {
  ResourceBinding resource_binding = 1;
}

message PatchResourceBindingRequest {
  string resource_binding_id = 1;
  optional string resolved_locator = 2;
  optional PolicyDocument grant = 3;
}

message PatchResourceBindingResponse {
  ResourceBinding resource_binding = 1;
}

message DeleteResourceBindingRequest {
  string resource_binding_id = 1;
}

message DeleteResourceBindingResponse {
  string resource_binding_id = 1;
  bool deleted = 2;
}

message WorkProfile {
  string version = 1;
  string work_profile_id = 2;
  string display_name = 3;
  string description = 4;
  repeated string project_ids = 5;
  repeated string intended_resources = 6;
  PolicyDocument default_policy = 7;
}

message AgentProfile {
  string version = 1;
  string agent_profile_id = 2;
  string display_name = 3;
  string description = 4;
  repeated string capabilities = 5;
  AgentConstraints constraints = 6;
}

message WorkSession {
  string version = 1;
  string work_session_id = 2;
  string display_name = 3;
  string project_id = 4;
  string project_snapshot_id = 5;
  string project_revision = 6;
  string work_profile_id = 7;
  repeated string agent_profile_ids = 8;
  WorkSessionState state = 9;
  PolicyDocument policy = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp closed_at = 13;
}

message ListWorkProfilesRequest {}

message ListWorkProfilesResponse {
  repeated WorkProfile work_profiles = 1;
}

message GetWorkProfileRequest {
  string work_profile_id = 1;
}

message GetWorkProfileResponse {
  WorkProfile work_profile = 1;
}

message PutWorkProfileRequest {
  WorkProfile work_profile = 1;
}

message PutWorkProfileResponse {
  WorkProfile work_profile = 1;
}

message DeleteWorkProfileRequest {
  string work_profile_id = 1;
}

message DeleteWorkProfileResponse {
  string work_profile_id = 1;
  bool deleted = 2;
}

message ListAgentProfilesRequest {}

message ListAgentProfilesResponse {
  repeated AgentProfile agent_profiles = 1;
}

message GetAgentProfileRequest {
  string agent_profile_id = 1;
}

message GetAgentProfileResponse {
  AgentProfile agent_profile = 1;
}

message PutAgentProfileRequest {
  AgentProfile agent_profile = 1;
}

message PutAgentProfileResponse {
  AgentProfile agent_profile = 1;
}

message DeleteAgentProfileRequest {
  string agent_profile_id = 1;
}

message DeleteAgentProfileResponse {
  string agent_profile_id = 1;
  bool deleted = 2;
}

message ListWorkSessionsRequest {
  WorkSessionState state = 1;
  string project_id = 2;
}

message ListWorkSessionsResponse {
  repeated WorkSession work_sessions = 1;
}

message GetWorkSessionRequest {
  string work_session_id = 1;
}

message GetWorkSessionResponse {
  WorkSession work_session = 1;
}

message CreateWorkSessionRequest {
  WorkSession work_session = 1;
}

message CreateWorkSessionResponse {
  WorkSession work_session = 1;
}

message TransitionWorkSessionRequest {
  string work_session_id = 1;
  WorkSessionState state = 2;
}

message TransitionWorkSessionResponse {
  WorkSession work_session = 1;
}

message PatchWorkSessionRequest {
  string work_session_id = 1;
  optional string display_name = 2;
  optional AgentProfileIDs agent_profile_ids = 3;
  optional PolicyDocument policy = 4;
}

message PatchWorkSessionResponse {
  WorkSession work_session = 1;
}

message AgentProfileIDs {
  repeated string values = 1;
}

message DeleteWorkSessionRequest {
  string work_session_id = 1;
}

message DeleteWorkSessionResponse {
  string work_session_id = 1;
  bool deleted = 2;
}

// ProjectDefinition is the closed AWM Project projection supported by
// Switchboard: no arbitrary extension object, JSON patch, or untyped fields.
message ProjectDefinition {
  string version = 1;
  string name = 2;
  string description = 3;
  string display_name = 4;
  PolicyDocument policy = 5;
}

message ProjectSummary {
  string project_id = 1;
  string title = 2;
  string description = 3;
  string revision = 4;
  string source_revision = 5;
  string definition_uri = 6;
  uint32 diagnostic_count = 7;
}

message Source {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_USER = 1;
    KIND_REPOSITORY = 2;
  }
  Kind kind = 1;
  string uri = 2;
  int32 precedence = 3;
}

message Diagnostic {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_WARNING = 1;
    SEVERITY_ERROR = 2;
  }
  Severity severity = 1;
  string code = 2;
  string message = 3;
  string source_uri = 4;
  string path = 5;
}

message ListProjectsRequest {
  string cursor = 1;
}

message SearchProjectsRequest {
  string query = 1;
  string cursor = 2;
}

message ListProjectsResponse {
  repeated ProjectSummary projects = 1;
  string next_cursor = 2;
}

message SearchProjectsResponse {
  repeated ProjectSummary projects = 1;
  string next_cursor = 2;
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  string project_id = 1;
  string revision = 2;
  string source_revision = 3;
  ProjectDefinition definition = 4;
  ProjectSummary summary = 5;
  repeated Source sources = 6;
  repeated Diagnostic diagnostics = 7;
  string uri = 8;
}

message ResolveProjectRequest {
  string project_id = 1;
  string root_uri = 2;
}

message ResolveProjectResponse {
  string project_id = 1;
  string revision = 2;
  string definition_uri = 3;
  string root_uri = 4;
  repeated Source sources = 5;
  repeated Diagnostic diagnostics = 6;
}

message ValidateProjectRequest {
  ProjectDefinition definition = 1;
  string root_uri = 2;
}

message ValidateProjectResponse {
  bool valid = 1;
  repeated Diagnostic diagnostics = 2;
}

message CreateProjectRequest {
  ProjectDefinition definition = 1;
}

message CreateProjectResponse {
  ProjectSummary project = 1;
}

message UpdateProjectRequest {
  string project_id = 1;
  string expected_source_revision = 2;
  ProjectDefinition definition = 3;
}

message UpdateProjectResponse {
  ProjectSummary project = 1;
}

message PatchProjectRequest {
  string project_id = 1;
  string expected_source_revision = 2;
  ProjectPatch patch = 3;
}

// ProjectPatch is a closed field-mask-free patch. Presence distinguishes no
// change from clearing description to the empty string.
message ProjectPatch {
  optional string description = 1;
}

message PatchProjectResponse {
  ProjectSummary project = 1;
}

message DeleteProjectRequest {
  string project_id = 1;
  string expected_source_revision = 2;
  string expected_raw_source_revision = 3;
}

message DeleteProjectResponse {
  string project_id = 1;
  bool deleted = 2;
}

message GetProjectRevisionRequest {
  string project_id = 1;
  string revision = 2;
}

message GetProjectRevisionResponse {
  string project_id = 1;
  string revision = 2;
  ProjectDefinition definition = 3;
}

message GetProjectDiagnosticsRequest {
  string project_id = 1;
  string root_uri = 2;
}

message GetProjectDiagnosticsResponse {
  string project_id = 1;
  repeated Diagnostic diagnostics = 2;
}
