name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Check gofmt
        run: test -z "$(gofmt -l .)" || (echo "Run 'make fmt' to fix formatting"; gofmt -l .; exit 1)

      - name: Build
        run: go build -o switchboard ./cmd/server

      - name: Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read Node version
        id: node
        run: echo "version=$(make --no-print-directory node-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Run web unit tests
        run: make test-web

      - name: Check generated CSS
        run: |
          make styles
          git diff --exit-code -- web/static/style.css

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Chromium and system dependencies
        run: make ui-install UI_INSTALL_ARGS=--with-deps

      - name: Verify integration setup in Chromium
        run: make test-ui

      - name: Upload masked browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-ui-${{ github.sha }}
          path: dist/ui-artifacts/
          if-no-files-found: error
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run browser interaction tests
        run: make test-browser

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        run: go tool golangci-lint run

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run gosec
        run: go tool gosec -exclude-dir=gen -exclude=G101,G104,G115,G117,G119,G120,G304,G505,G704,G706 ./...

      - name: Run govulncheck
        run: go tool govulncheck ./...

  rust-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check Rust guest SDK compiles
        working-directory: wasm/guest-rust
        run: cargo check --target wasm32-unknown-unknown

      - name: Test AWM protobuf client crate
        working-directory: rust/switchboard-awm
        run: cargo test

      - name: Verify packaged AWM crate artifact
        working-directory: rust/switchboard-awm
        run: ./scripts/package-verify.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose lifecycle tests
        run: bash scripts/compose-dev_test.sh

      - name: Compose contract check
        run: bash scripts/compose-dev.sh check
        env:
          STACKLANE_INSTANCE: ci
