name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Merging several PRs in a row tags several releases; run them one at a
# time so they don't race to publish or pull base images together.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser runs inside goreleaser-cross so the macOS binaries can be
      # built with cgo against a real macOS SDK (1Password desktop sign-in).
      # It reuses this runner's Docker daemon, ghcr.io login and buildx
      # builder. release-dry-run.yml runs the same command on pull requests.
      - name: Run goreleaser
        run: |
          GORELEASER_DOCKER_CONFIG="$HOME/.docker" \
            bash scripts/goreleaser-cross.sh release --clean --timeout 50m --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GORELEASER_GO_CACHE: "1"
