version: 2

project_name: switchboard

before:
  hooks:
    - go mod tidy

builds:
  # Linux and Windows stay pure Go (CGO_ENABLED=0): the binaries are static,
  # so the FROM scratch Docker image and the apk/deb/rpm packages run anywhere.
  - id: switchboard
    main: ./cmd/server
    binary: switchboard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags: &ldflags
      - -s -w
      - -X github.com/daltoniam/switchboard/version.Version={{.Version}}
      - -X github.com/daltoniam/switchboard/version.Commit={{.ShortCommit}}
      - -X github.com/daltoniam/switchboard/version.Date={{.Date}}

  # macOS builds use cgo so 1Password desktop app sign-in works: the 1Password
  # SDK loads the app's library with dlopen, which needs cgo on macOS. The
  # release runs inside ghcr.io/goreleaser/goreleaser-cross, whose osxcross
  # clang wrappers link against a real macOS SDK. TestGoreleaserCgoTargets
  # keeps this split in place.
  - id: switchboard-darwin
    main: ./cmd/server
    binary: switchboard
    env:
      - CGO_ENABLED=1
      # Same minimum macOS version as the earlier pure Go builds.
      - MACOSX_DEPLOYMENT_TARGET=13.0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: darwin
        goarch: amd64
        goamd64: v1
        env:
          - CC=o64-clang
          - CXX=o64-clang++
      - goos: darwin
        goarch: arm64
        goarm64: v8.0
        env:
          - CC=oa64-clang
          - CXX=oa64-clang++
    ldflags: *ldflags

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

brews:
  - repository:
      owner: daltoniam
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/daltoniam/switchboard"
    description: "Unified MCP server aggregating 17+ integrations (GitHub, Datadog, Linear, Slack, AWS, GCP, and more) behind a single endpoint"
    license: "MIT"
    test: |
      system "#{bin}/switchboard", "--help"

homebrew_casks:
  - repository:
      owner: daltoniam
      name: homebrew-tap
    directory: Casks
    homepage: "https://github.com/daltoniam/switchboard"
    description: "Unified MCP server aggregating 17+ integrations (GitHub, Datadog, Linear, Slack, AWS, GCP, and more) behind a single endpoint"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/switchboard"]
          end
    caveats: |
      To start the background daemon, run:
        switchboard daemon install

      To uninstall the daemon before removing the cask, run:
        switchboard daemon uninstall

scoops:
  - repository:
      owner: daltoniam
      name: scoop-bucket
    homepage: "https://github.com/daltoniam/switchboard"
    description: "Unified MCP server aggregating 17+ integrations (GitHub, Datadog, Linear, Slack, AWS, GCP, and more) behind a single endpoint"
    license: "MIT"

nfpms:
  - package_name: switchboard
    homepage: "https://github.com/daltoniam/switchboard"
    description: "Unified MCP server aggregating 17+ integrations (GitHub, Datadog, Linear, Slack, AWS, GCP, and more) behind a single endpoint"
    maintainer: "Austin Cherry <austin@daltoniam.com>"
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    contents:
      - src: packaging/switchboard.service
        dst: /usr/share/switchboard/switchboard.service
        type: config
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh

dockers:
  - image_templates:
      - "ghcr.io/daltoniam/switchboard:{{ .Version }}-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
  - image_templates:
      - "ghcr.io/daltoniam/switchboard:{{ .Version }}-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/daltoniam/switchboard:{{ .Version }}"
    image_templates:
      - "ghcr.io/daltoniam/switchboard:{{ .Version }}-amd64"
      - "ghcr.io/daltoniam/switchboard:{{ .Version }}-arm64"
  - name_template: "ghcr.io/daltoniam/switchboard:latest"
    image_templates:
      - "ghcr.io/daltoniam/switchboard:{{ .Version }}-amd64"
      - "ghcr.io/daltoniam/switchboard:{{ .Version }}-arm64"

release:
  github:
    owner: daltoniam
    name: switchboard
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
