      - experiments[].tags
      - experiments[].ownerEmail
      - experiments[].hypothesis
      - experiments[].dateUpdated
      - experiments[].variations
      - experiments[].phases
      - experiments[].settings.datasourceId
      - experiments[].settings.goals
      - experiments[].settings.statsEngine
      - experiments[].linkedFeatures
      - experiments[].resultSummary
