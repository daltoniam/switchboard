      - experiment.name
      - experiment.type
      - experiment.status
      - experiment.enhancedStatus
      - experiment.archived
      - experiment.project
      - experiment.tags
      - experiment.ownerEmail
      - experiment.hypothesis
      - experiment.description
      - experiment.dateCreated
      - experiment.dateUpdated
      - experiment.hashAttribute
      - experiment.variations
      - experiment.phases
      - experiment.settings.datasourceId
      - experiment.settings.assignmentQueryId
      - experiment.settings.experimentId
      - experiment.settings.segmentId
      - experiment.settings.statsEngine
      - experiment.settings.attributionModel
      - experiment.settings.goals
      - experiment.settings.secondaryMetrics
      - experiment.settings.guardrails
      - experiment.linkedFeatures
      - experiment.resultSummary
  growthbook_get_experiment_results:
    spec:
      - experiment.id
      - experiment.name
      - experiment.status
      - experiment.enhancedStatus
      - experiment.variations
      - result.id
      - result.dateUpdated
