# Switchboard compaction specs for the growthbook integration.
#
# Schema: tools.<tool_name>: { spec: [<spec_lines>], max_bytes?: <int> }
#
# Full spec syntax (paths, arrays, aliases, exclusions): docs/field-compaction.md.
#
# Feature flag environments are keyed by environment id (a dynamic map), so
# list_features and get_feature keep the whole environments object. Each
# environment carries a compiled SDK "definition" string that repeats the
# rules; the engine cannot reach keys under the dynamic map, so handlers drop
# it before compaction (see dropEnvironmentDefinitions in handlers.go).
#
# Secrets never reach compaction: handlers strip SDK connection encryption and
# proxy signing keys, data source connection parameters, and the secure
# attribute salt in settings, so script callers (which bypass compaction) do
# not see them either.
#
# Rules inside a list are nested arrays, which the engine cannot project into
# sub-objects, so list_features keeps rules whole. Experiment results keep the
# per-dimension result rows whole for the same reason; they are already the
# decision data (users, chance to win, percent change, intervals).

version: 1
tools:
  growthbook_list_features:
    spec:
      - features[].id
      - features[].description
      - features[].valueType
      - features[].defaultValue
      - features[].archived
      - features[].project
      - features[].tags
      - features[].ownerEmail
      - features[].dateUpdated
      - features[].environments
      - features[].rules
      - features[].prerequisites
      - features[].revision.version
      - total
      - hasMore
      - nextOffset
  growthbook_get_feature:
    spec:
      - feature.id
      - feature.description
      - feature.valueType
      - feature.defaultValue
      - feature.archived
      - feature.project
      - feature.tags
      - feature.ownerEmail
      - feature.dateCreated
      - feature.dateUpdated
      - feature.environments
      - feature.rules
      - feature.prerequisites
      - feature.revision.version
      - feature.revision.comment
      - feature.revision.date
      - feature.revision.publishedBy.name
  growthbook_get_feature_staleness:
    spec:
      - features.*
  growthbook_list_feature_revisions:
    spec:
      - revisions[].id
      - revisions[].featureId
      - revisions[].version
      - revisions[].baseVersion
      - revisions[].status
      - revisions[].comment
      - revisions[].date
      - revisions[].createdBy.name
      - revisions[].publishedBy.name
      - revisions[].environmentsEnabled
      - revisions[].defaultValue
      - revisions[].rules
      - total
      - hasMore
      - nextOffset
  growthbook_list_experiments:
