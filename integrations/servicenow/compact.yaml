        spec:
            - result[].sys_id
            - result[].number
            - result[].short_description
            - result[].state
            - result[].priority
            - result[].urgency
            - result[].impact
            - result[].assigned_to
            - result[].assignment_group
            - result[].caller_id
            - result[].category
            - result[].sys_updated_on
            - result[].sys_created_on
