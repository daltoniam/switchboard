# Switchboard compaction specs for the ashby integration (API key mode).
#
# Schema: tools.<tool_name>: { spec: [<spec_lines>], max_bytes?: <int> }
#
# The `spec` array is a WHITELIST: only fields whose paths are listed survive
# compaction; everything else is stripped from the response. Within a kept
# parent, use `-field` or `-*_pattern` for explicit exclusions.
#
# These specs apply only to the native REST tools. Hosted MCP responses (sign
# in with Ashby) are shaped by Ashby's server and are never compacted, even
# where a tool name is shared (ashby_get_candidate).
#
# Handler output: {"results": <records>, "moreDataAvailable", "nextCursor",
# "syncToken"}; the pagination keys appear on paginated endpoints only.
#
# Inside results[] a nested path keeps only its leaf name, so two nested
# fields with the same leaf (candidate.id and job.id) would overwrite each
# other. Lists therefore keep small nested objects whole (job,
# currentInterviewStage) or one uniquely named leaf (candidate.name).
#
# Recruiting data is PII-heavy. Lists keep identifiers, names, stages,
# statuses, dates, and job/application links, plus a primary email where it
# is the identifier people search by. Phone numbers, social links, addresses,
# resumes and file handles, custom fields, form answers, and full nested user
# objects are dropped; get_* tools and scripts return them when needed.
#
# List tools with live cases (web/live_ashby_test.go) keep fields Ashby's
# schema marks required, or that every real record has (a job's department
# and location), so a live run does not flag a field that is merely empty on
# one page. Single-record get_* tools keep optional fields too.
#
# Override at runtime: set $SWITCHBOARD_COMPACT_DIR=/path; place ashby.yaml
# there with only the tools you want to change.
#
# Full spec syntax: docs/field-compaction.md.

