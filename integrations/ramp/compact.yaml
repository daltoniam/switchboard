# Switchboard compaction specs for the ramp integration.
#
# Schema: tools.<tool_name>: { spec: [<spec_lines>], max_bytes?: <int> }
#
# Full spec syntax (paths, arrays, aliases, exclusions): docs/field-compaction.md.

version: 1
tools:
    ramp_list_transactions:
        spec:
            - data[].id
            - data[].amount
            - data[].currency_code
            - data[].merchant_name
            - data[].merchant_id
            - data[].state
            - data[].user_transaction_time
            - data[].card_id
            - data[].card_holder.first_name
            - data[].card_holder.last_name
            - data[].card_holder.user_id
            - data[].memo
            - data[].sync_status
            - data[].sk_category_name
            - data[].entity_id
            - page.next
