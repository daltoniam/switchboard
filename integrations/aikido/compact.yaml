# Switchboard compaction specs for the aikido integration.
#
# Schema: tools.<tool_name>: { spec: [<spec_lines>], max_bytes?: <int> }
#
# The `spec` array is a WHITELIST: only fields whose paths are listed survive
# compaction; everything else is stripped from the response. Scripts always
# get the raw response.
#
# Paginated list tools return {"results": [...], "page", "per_page",
# "has_next_page"}; every other tool returns Aikido's JSON as is. Inside
# results[] a nested path keeps only its leaf name, so two nested fields with
# the same leaf would overwrite each other, and several fields of one nested
# array (results[].locations[].id and .name) overwrite each other too; such
# small nested arrays are kept whole.
#
# Lists keep identifiers, names, severities, statuses, CVE ids, affected
# packages and files, owning resources and timestamps, which is what triage
# needs to pick the next call. Long remediation text (how_to_fix) and raw
# metadata objects are left to the get_* tools.
#
# Override at runtime: set $SWITCHBOARD_COMPACT_DIR=/path; place aikido.yaml
# there with only the tools you want to change.
#
# Full spec syntax: docs/field-compaction.md.

version: 1
tools:
  # ── Issues ──────────────────────────────────────────────────────────
  aikido_list_issue_groups:
    spec:
      - page
      - per_page
      - has_next_page
