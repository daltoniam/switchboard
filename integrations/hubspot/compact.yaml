# Switchboard compaction specs for the hubspot integration.
#
# Schema: tools.<tool_name>: { spec: [<spec_lines>], max_bytes?: <int> }
#
# Full spec syntax (paths, arrays, aliases, exclusions): docs/field-compaction.md.

version: 1
tools:
    hubspot_search_contacts:
        spec:
            - total
            - results[].id
            - results[].properties
            - results[].createdAt
            - results[].updatedAt
            - results[].archived
            - paging.next.after
