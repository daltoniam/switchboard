            - tickets[].subject
            - tickets[].status
            - tickets[].priority
            - tickets[].type
            - tickets[].requester_id
            - tickets[].assignee_id
            - tickets[].group_id
            - tickets[].tags
            - tickets[].created_at
            - tickets[].updated_at
