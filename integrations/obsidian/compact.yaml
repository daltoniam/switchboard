# Switchboard compaction specs for the obsidian integration.
#
# Schema: tools.<tool_name>: { spec: [<spec_lines>], max_bytes?: <int> }
#
# The `spec` array is a WHITELIST: only listed paths survive compaction.
# Mutation tools have no spec so they return their full confirmation.
#
# Override at runtime: set $SWITCHBOARD_COMPACT_DIR=/path; place
# obsidian.yaml there with only the tools you want to change.
#
# Full spec syntax (paths, arrays, aliases, exclusions): docs/field-compaction.md.

version: 1
tools:
  # ── Discovery ────────────────────────────────────────────────────
  obsidian_list_files:
    spec:
      - path
      - files
      - count

  # simple search: [{filename, score, matches: [{match: {start, end, source}, context}]}]
  # Offsets are dropped; the context snippet is what routes the next read.
  obsidian_search:
    spec:
      - query
      - total
      - returned
      - results[].filename
      - results[].score
      - results[].matches[].context

  obsidian_query:
    spec:
      - total
      - returned
      - results[].filename
      - results[].result

  obsidian_list_tags:
    spec:
      - tags[].name
      - tags[].count

  obsidian_list_commands:
    spec:
      - total
      - commands[].id
      - commands[].name

  # ── Reading ──────────────────────────────────────────────────────
  # note+json: {path, content, frontmatter, tags, stat{ctime,mtime,size},
  # links, backlinks, unresolvedLinks}. Targeted reads return {path, target,
  # content}; target only echoes the request, so it is not kept.
  obsidian_read_note:
    spec:
      - path
      - content
      - frontmatter
      - tags
      - stat.mtime
      - stat.size
      - links
      - backlinks

  obsidian_get_active_note:
    spec:
      - path
      - content
      - frontmatter
      - tags
      - stat.mtime
      - stat.size
      - links
      - backlinks

  obsidian_get_document_map:
    spec:
      - path
      - version
      - headings
      - blocks
      - frontmatterFields
