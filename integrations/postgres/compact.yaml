# Switchboard compaction specs for the postgres integration.
#
# Schema: tools.<tool_name>: { spec: [<spec_lines>], max_bytes?: <int> }
#
# The `spec` array is a WHITELIST: only fields whose paths are listed survive
# compaction; everything else is stripped from the response. Within a kept
# parent, use `-field` or `-*_pattern` for explicit exclusions (the only
# blacklist-style escape hatch).
#
# Override at runtime: set $SWITCHBOARD_COMPACT_DIR=/path; place
# postgres.yaml there with only the tools you want to change. Per-tool merge
# replaces embedded values; omitted tools fall through to these defaults.
#
# Full spec syntax (paths, arrays, aliases, exclusions): docs/field-compaction.md.

version: 1
tools:
    postgres_database_info:
        spec:
            - version
            - database
            - user
            - encoding
            - timezone
            - max_connections
    postgres_database_size:
        spec:
            - database
            - database_size
            - schema
            - table_name
            - total_size
            - estimated_rows
    postgres_describe_table:
        spec:
            - column_name
            - data_type
            - is_nullable
            - column_default
            - is_primary_key
    postgres_list_active_connections:
        spec:
            - pid
            - user
            - database
            - state
            - query
            - query_start
            - duration_seconds
            - client_addr
    postgres_list_columns:
        spec:
            - column_name
            - data_type
            - ordinal_position
            - is_nullable
    postgres_list_constraints:
        spec:
            - constraint_name
            - constraint_type
            - column_name
            - references_table
            - references_column
            - check_clause
    postgres_list_enums:
        spec:
            - enum_name
            - values
    postgres_list_extensions:
        spec:
            - name
            - version
            - schema
            - comment
    postgres_list_foreign_keys:
        spec:
            - constraint_name
            - from_column
            - to_schema
            - to_table
            - to_column
            - delete_rule
    postgres_list_functions:
        spec:
            - function_name
            - arguments
            - return_type
            - kind
    postgres_list_grants:
        spec:
            - grantee
            - privilege_type
            - table_name
    postgres_list_indexes:
        spec:
            - index_name
            - definition
            - is_unique
            - is_primary
            - size
    postgres_list_locks:
        spec:
            - blocked_pid
            - blocked_user
            - blocked_query
            - blocked_mode
            - blocking_pid
            - blocking_user
            - blocking_query
            - blocking_mode
            - locktype
    postgres_list_roles:
        spec:
            - role_name
            - is_superuser
            - can_create_db
            - can_create_role
            - can_login
    postgres_list_schemas:
        spec:
            - schema_name
    postgres_list_tables:
        spec:
            - table_name
            - estimated_rows
            - total_size
            - comment
    postgres_list_triggers:
        spec:
            - trigger_name
            - table_name
            - timing
            - event
            - action_statement
    postgres_list_views:
        spec:
            - view_name
            - view_definition
    postgres_running_queries:
        spec:
            - pid
            - user
            - state
            - query
            - duration_seconds
            - wait_event_type
            - wait_event
    postgres_table_stats:
        spec:
            - table_name
            - live_rows
            - dead_rows
            - last_vacuum
            - last_autovacuum
            - last_analyze
            - last_autoanalyze
            - total_size
